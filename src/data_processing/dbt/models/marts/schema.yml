version: 2

models:
  - name: fact_orders_items
    description: Gold fact at order-item grain, reconciled with analytics.order_items.
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: quantity
        data_tests:
          - not_null
      - name: currency_code
        data_tests:
          - not_null
      - name: unit_price
        data_tests:
          - not_null
      - name: total_price
        data_tests:
          - not_null
      - name: event_timestamp
        data_tests:
          - not_null
      - name: event_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["SUCCEED", "CANCELLED"]
