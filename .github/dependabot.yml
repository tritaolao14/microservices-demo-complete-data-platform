version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /src/checkoutservice
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /src/productcatalogservice
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /src/shippingservice
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /src/frontend
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /src/cartservice/src
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /src/currencyservice
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /src/paymentservice
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /src/emailservice
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /src/recommendationservice
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /src/loadgenerator
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /src/adservice
    schedule:
      interval: weekly