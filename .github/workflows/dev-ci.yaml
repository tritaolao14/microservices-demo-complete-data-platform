# Dev CI: build only services whose source changed, push to GHCR, and
# update the dev overlay image tag for each. ArgoCD dev app auto-syncs
# the overlay update → deploy into onlineboutique-dev within minutes.
# No post-main, no smoke test, no kind cluster.
#
# Triggered on push to Anh200726 when src/** changes. Overlay-only
# pushes (gitops/**) are ignored to prevent infinite loops.

name: "Dev CI - Build affected services"

on:
  push:
    branches:
      - Anh200726
    paths:
      - 'src/**'
      - '.github/workflows/dev-ci.yaml'
  workflow_dispatch: {}

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: tritaolao14
          password: ${{ secrets.GHCR_PAT }}

      - name: Detect changed services
        id: changes
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD -- src/ \
            | sed -n 's|^src/\([^/]*\)/.*|\1|p' \
            | sort -u)

          # Allowlist: only services with an image in the gitops overlay.
          # shoppingassistantservice, loadgenerator, data_processing are
          # excluded (not in gitops stack).
          ALLOWLIST="adservice cartservice checkoutservice currencyservice dataingestion emailservice frontend paymentservice productcatalogservice recommendationservice shippingservice"

          SERVICES=""
          for svc in $CHANGED; do
            for a in $ALLOWLIST; do
              if [ "$svc" = "$a" ]; then
                SERVICES="$SERVICES $svc"
                break
              fi
            done
          done

          SERVICES=$(echo "$SERVICES" | xargs)
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          if [ -z "$SERVICES" ]; then
            echo "no deployable services changed"
          else
            echo "will build: $SERVICES"
          fi

      - name: Build and push affected services
        if: steps.changes.outputs.services != ''
        run: |
          TAG="${{ github.sha }}"

          for SVC in ${{ steps.changes.outputs.services }}; do
            echo "== building $SVC =="

            # cartservice has a non-standard context (src/cartservice/src)
            if [ "$SVC" = "cartservice" ]; then
              CTX="src/cartservice/src"
            else
              CTX="src/$SVC"
            fi

            docker build \
              -f "$CTX/Dockerfile" \
              -t "ghcr.io/tritaolao14/$SVC:$TAG" \
              "$CTX"
            docker push "ghcr.io/tritaolao14/$SVC:$TAG"
            echo "pushed ghcr.io/tritaolao14/$SVC:$TAG"
          done

      - name: Update dev overlay image tags
        if: steps.changes.outputs.services != ''
        run: |
          TAG="${{ github.sha }}"
          OVERLAY="gitops/overlays/dev/kustomization.yaml"

          python3 - <<PY
          import os, re, sys

          tag = os.environ["TAG"]
          services = "${{ steps.changes.outputs.services }}".split()
          overlay = os.environ["OVERLAY"]

          text = open(overlay).read()

          for svc in services:
              pattern = (
                  r"(- name: " + re.escape(svc) + r"\n"
                  r"  newName: [^\n]+\n"
                  r"  newTag: )\S+"
              )
              replacement = r"\g<1>" + tag
              new_text, n = re.subn(pattern, replacement, text, count=1)
              if n == 0:
                  print(f"WARNING: image block for {svc} not found in {overlay}", file=sys.stderr)
              else:
                  text = new_text
                  print(f"updated {svc} -> {tag}")

          open(overlay, "w").write(text)
          PY

      - name: Commit and push overlay update
        if: steps.changes.outputs.services != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "no overlay change"
            exit 0
          fi
          git commit -m "chore(gitops): update dev overlay image tags to $TAG [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:Anh200726
