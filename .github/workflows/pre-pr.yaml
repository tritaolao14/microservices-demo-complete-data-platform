# Pre-merge CI (fast checks): lint + unit tests + manifest validation +
# security scan, scoped to the files changed in the PR. No secrets and no
# deployment. See docs/ci-strategy.md.

name: "Pre-PR - Fast checks"

on:
  pull_request:
    branches:
      - main
      - Anh200726

concurrency:
  group: pre-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            src/checkoutservice/go.sum
            src/frontend/go.sum
            src/productcatalogservice/go.sum
            src/shippingservice/go.sum
      - name: Lint & Test Go services
        run: |
          set -e
          for SERVICE in shippingservice productcatalogservice frontend checkoutservice; do
            echo "== testing $SERVICE =="
            pushd src/$SERVICE
            gofmt -l .
            # copylocks is disabled: the legacy money.go passes protobuf
            # money.Money by value (upstream pattern), which trips the
            # copylocks vet check across the whole baseline. See
            # docs/ci-strategy.md for the baseline policy.
            go vet -copylocks=false ./...
            go test ./...
            popd
          done

  dotnet-cartservice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: "./.dotnet"
        with:
          dotnet-version: '10.0'
      - name: Test cartservice
        run: dotnet test src/cartservice/

  node-services:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [currencyservice, paymentservice]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/${{ matrix.service }}/package-lock.json
      - name: Install + syntax-check ${{ matrix.service }}
        run: |
          cd src/${{ matrix.service }}
          npm ci --ignore-scripts
          find . -maxdepth 1 -name '*.js' -exec node --check {} \;

  python-services:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [emailservice, recommendationservice, loadgenerator, data_processing, dataingestion]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile all Python
        run: |
          cd src/${{ matrix.service }}
          python -m py_compile ./*.py
      - name: Ruff (strict, changed files only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only "${BASE_SHA}"...HEAD -- 'src/${{ matrix.service }}/**/*.py')
          if [ -z "$CHANGED" ]; then
            echo "no .py files changed in ${{ matrix.service }}; skipping ruff"
            exit 0
          fi
          pip install ruff
          # shellcheck disable=SC2086
          ruff check $CHANGED

  java-adservice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test adservice
        run: |
          cd src/adservice
          chmod +x ./gradlew
          ./gradlew --no-daemon test

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-kubectl@v4
      - name: kustomize build kubernetes-manifests
        run: kubectl kustomize kubernetes-manifests > /dev/null
      - name: kustomize build kustomize base + tests
        run: |
          cd kustomize
          kubectl kustomize . > /dev/null
          for d in tests/*/; do echo "build $d"; kubectl kustomize "$d" > /dev/null; done
      - name: kustomize build gitops overlays
        run: |
          kubectl kustomize gitops/overlays/staging > /dev/null
          kubectl kustomize gitops/overlays/production > /dev/null
      - name: helm lint & template
        run: |
          helm lint helm-chart
          helm template data-platform helm-chart > /dev/null

  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      # Report-only: the legacy codebase has a pre-existing scan baseline.
      # Findings surface in the Actions UI; blocking enforcement can be
      # enabled later after the baseline is addressed.
      - name: Trivy filesystem scan (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
          ignore-unfixed: true
      - name: Upload filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy config scan (K8s manifests, report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: kubernetes-manifests
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'
      - name: Upload config SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config