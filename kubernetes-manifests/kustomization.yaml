apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - adservice.yaml
  - cartservice.yaml
  - checkoutservice.yaml
  - currencyservice.yaml
  - dataingestion.yaml
  - emailservice.yaml
  - frontend.yaml
  - lakehouse-bronze-writer.yaml
# - loadgenerator.yaml # During development, the loadgenerator module inside skaffold.yaml will be used.
  - paymentservice.yaml
  - productcatalogservice.yaml
  - recommendationservice.yaml
  - shippingservice.yaml
  - kafka.yaml
  - postgresql.yaml
  - minio.yaml
  - spark-bronze-orders.yaml
  - spark-iceberg-maintenance.yaml
  - local-cdn.yaml
  - spark-iceberg-config.yaml
configMapGenerator:
- name: spark-bronze-orders-script
  files:
  - spark-bronze-orders.py
  options:
    disableNameSuffixHash: true
- name: spark-iceberg-maintenance-script
  files:
  - spark-iceberg-maintenance.py
  options:
    disableNameSuffixHash: true

