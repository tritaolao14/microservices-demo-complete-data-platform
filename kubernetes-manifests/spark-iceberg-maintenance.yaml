# DPFMD-36: Iceberg table maintenance for my_catalog.bronze.orders.
#
# The ticket asked for Delta Lake "VACUUM 7d"; Iceberg has no VACUUM, so the
# driver maps that intent onto expire_snapshots / rewrite_data_files /
# remove_orphan_files. See spark-iceberg-maintenance.py for the full mapping.
#
# Lives in the base manifests so all three overlays (dev/staging/production)
# inherit it, the same way spark-bronze-orders.yaml does. ArgoCD syncs each
# overlay from its own branch: staging tracks Anh200726, production tracks main.
#
# The Spark configuration block is duplicated from spark-bronze-orders.yaml on
# purpose -- both jobs must point at the same catalog, and sharing it means
# editing a file that has already merged.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-iceberg-maintenance
  labels:
    app: spark-iceberg-maintenance
spec:
  # Off the hour: several clusters run cron on :00, and a maintenance job that
  # competes with everything else is harder to reason about when it is slow.
  schedule: "23 4 * * *"
  timeZone: Etc/UTC
  # Forbid: expire_snapshots and rewrite_data_files both take table-level
  # commits. Overlapping runs could contend on the same metadata.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: spark-iceberg-maintenance
        spec:
          restartPolicy: Never
          containers:
          - name: maintenance
            image: apache/spark:3.5.3
            imagePullPolicy: IfNotPresent
            command: ["/opt/spark/bin/spark-submit"]
            env:
            - name: AWS_REGION
              value: us-east-1
            # Dry-run on by default: the first runs report orphan candidates
            # without deleting anything. Set to "false" once the output has
            # been reviewed.
            - name: ICEBERG_ORPHAN_DRY_RUN
              value: "true"
            args:
            - "--master"
            - "local[2]"
            - "--conf"
            - "spark.jars.ivy=/tmp/ivy"
            - "--packages"
            - "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1,org.postgresql:postgresql:42.7.3,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262"
            - "--conf"
            - "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
            - "--conf"
            - "spark.sql.catalog.my_catalog=org.apache.iceberg.spark.SparkCatalog"
            - "--conf"
            - "spark.sql.catalog.my_catalog.type=jdbc"
            - "--conf"
            - "spark.sql.catalog.my_catalog.uri=jdbc:postgresql://postgres:5432/product_catalog"
            - "--conf"
            - "spark.sql.catalog.my_catalog.jdbc.user=boutique"
            - "--conf"
            - "spark.sql.catalog.my_catalog.jdbc.password=boutique_pass"
            - "--conf"
            - "spark.sql.catalog.my_catalog.warehouse=s3a://iceberg-warehouse/"
            - "--conf"
            - "spark.sql.catalog.my_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO"
            - "--conf"
            - "spark.sql.catalog.my_catalog.s3.endpoint=http://minio:9000"
            - "--conf"
            - "spark.sql.catalog.my_catalog.s3.access-key-id=admin"
            - "--conf"
            - "spark.sql.catalog.my_catalog.s3.secret-access-key=admin123"
            - "--conf"
            - "spark.sql.catalog.my_catalog.s3.path-style-access=true"
            - "--conf"
            - "spark.sql.catalog.my_catalog.s3.region=us-east-1"
            - "--conf"
            - "spark.hadoop.fs.s3a.endpoint=http://minio:9000"
            - "--conf"
            - "spark.hadoop.fs.s3a.access.key=admin"
            - "--conf"
            - "spark.hadoop.fs.s3a.secret.key=admin123"
            - "--conf"
            - "spark.hadoop.fs.s3a.path.style.access=true"
            - "--conf"
            - "spark.hadoop.fs.s3a.connection.ssl.enabled=false"
            - "--conf"
            - "spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
            - "/opt/scripts/spark-iceberg-maintenance.py"
            volumeMounts:
            - name: script
              mountPath: /opt/scripts
              readOnly: true
            - name: config
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 2Gi
          volumes:
          - name: script
            configMap:
              name: spark-iceberg-maintenance-script
          - name: config
            configMap:
              name: spark-iceberg-config
          - name: tmp
            emptyDir: {}
