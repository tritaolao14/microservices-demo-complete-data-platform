# Staging overlay: deploys the app into the onlineboutique-staging namespace
# on the local kind cluster, using images published to GHCR (private).
# demo is replaced by the CI/local script with the actual image tag.
# loadgenerator is not part of the base (deployed separately, see base README).

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: onlineboutique-staging
resources:
- ../../base
images:
- name: adservice
  newName: ghcr.io/tritaolao14/adservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: cartservice
  newName: ghcr.io/tritaolao14/cartservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: checkoutservice
  newName: ghcr.io/tritaolao14/checkoutservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: currencyservice
  newName: ghcr.io/tritaolao14/currencyservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: emailservice
  newName: ghcr.io/tritaolao14/emailservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: frontend
  newName: ghcr.io/tritaolao14/frontend
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: paymentservice
  newName: ghcr.io/tritaolao14/paymentservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: productcatalogservice
  newName: ghcr.io/tritaolao14/productcatalogservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: recommendationservice
  newName: ghcr.io/tritaolao14/recommendationservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
- name: shippingservice
  newName: ghcr.io/tritaolao14/shippingservice
  newTag: c42390cae7fa612c02956849cae5a1de2d95fbf7
patches:
- target:
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
      - name: ghcr-secret