# Kafka Connect (Debezium) worker + PostgreSQL connector for the dev overlay.
#
# Captures row-level changes on public.products (WAL) and publishes them as
# Avro to Kafka topic cdc_product_changes. Pattern: CDC Replication
# (Data Engineering Design Patterns, Ch.2) / TODO.md Sprint 2.
#
# Debezium derives the change topic name as <topic.prefix>.<schema>.<table>,
# which here would be dbserver1.public.products. A RegexRouter single-message
# transform rewrites that to cdc_product_changes so the topic name stays
# stable and is the one documented for downstream consumers.
#
# Avro needs the Confluent converter plugin and a Schema Registry to register
# the product schema in, so this manifest depends on schema-registry.yaml
# (Deployment schema-registry, port 8081). Without it the connector task fails
# to start, because AvroConverter cannot serialise without a registry.
#
# Dev-only, like kafka-ui / pgadmin / loadgenerator: staging and production
# overlays only include ../../base, so this does not reach them.
#
# Image is our own debezium image (src/debezium/Dockerfile) because the
# upstream image has no Avro converter plugin. It is built FROM
# quay.io/debezium/connect:2.7.3.Final, so the worker itself is unchanged, and
# the tag is rewritten by the dev-ci workflow through gitops/overlays/dev/
# kustomization.yaml. The 2.7 base is required because the broker is Apache
# Kafka 3.6 (confluentinc/cp-kafka:7.6.1) while Debezium 2.7 ships Kafka
# Connect 3.7 clients.
#
# Requires postgres to run with -c wal_level=logical (see
# kubernetes-manifests/postgresql.yaml:32).

# SECURITY EXCEPTION (temporary): the dev DB password is committed in plain
# text here, which .agents/rules/security-governance.md forbids. It is
# deliberate for now because this cluster is an ephemeral kind cluster
# (scripts/ci-local.sh), where a committed SealedSecret cannot survive
# `kind delete cluster` (the sealing key lives in the cluster). Replace with
# SealedSecret or External Secrets, together with the plain-text
# POSTGRES_PASSWORD in kubernetes-manifests/postgresql.yaml:37, before this
# pattern is reused in staging or production. Tracked in TODO.md.
apiVersion: v1
kind: Secret
metadata:
  name: debezium-db
  labels:
    app: debezium-connect
type: Opaque
stringData:
  db_password: boutique_pass
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connector-config
  labels:
    app: debezium-connect
data:
  productcatalog-postgres.json: |-
    {
      "name": "productcatalog-postgres",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "postgres",
        "database.port": "5432",
        "database.user": "boutique",
        "database.password": "__DB_PASSWORD__",
        "database.dbname": "product_catalog",
        "topic.prefix": "dbserver1",
        "plugin.name": "pgoutput",
        "slot.name": "debezium_productcatalog",
        "publication.name": "debezium_productcatalog",
        "publication.autocreate.mode": "filtered",
        "table.include.list": "public.products",
        "snapshot.mode": "initial",
        "schema.history.internal.kafka.bootstrap.servers": "kafka:9092",
        "schema.history.internal.kafka.topic": "_schema-changes.product_catalog",
        "key.converter": "io.confluent.connect.avro.AvroConverter",
        "key.converter.schema.registry.url": "http://schema-registry:8081",
        "value.converter": "io.confluent.connect.avro.AvroConverter",
        "value.converter.schema.registry.url": "http://schema-registry:8081",
        "internal.key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "internal.value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "transforms": "route",
        "transforms.route.type": "org.apache.kafka.connect.transforms.RegexRouter",
        "transforms.route.regex": "dbserver1\\.public\\.products",
        "transforms.route.replacement": "cdc_product_changes"
      }
    }
  orderitems-postgres.json: |-
    {
      "name": "orderitems-postgres",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "postgres",
        "database.port": "5432",
        "database.user": "boutique",
        "database.password": "__DB_PASSWORD__",
        "database.dbname": "product_catalog",
        "topic.prefix": "orderdb",
        "plugin.name": "pgoutput",
        "slot.name": "debezium_orderitems",
        "publication.name": "debezium_orderitems",
        "publication.autocreate.mode": "filtered",
        "table.include.list": "analytics.order_items",
        "snapshot.mode": "initial",
        "schema.history.internal.kafka.bootstrap.servers": "kafka:9092",
        "schema.history.internal.kafka.topic": "_schema-changes.order_items",
        "key.converter": "io.confluent.connect.avro.AvroConverter",
        "key.converter.schema.registry.url": "http://schema-registry:8081",
        "value.converter": "io.confluent.connect.avro.AvroConverter",
        "value.converter.schema.registry.url": "http://schema-registry:8081",
        "internal.key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "internal.value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "transforms": "route",
        "transforms.route.type": "org.apache.kafka.connect.transforms.RegexRouter",
        "transforms.route.regex": "orderdb\\.analytics\\.order_items",
        "transforms.route.replacement": "cdc_order_items"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  labels:
    app: debezium-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
      # DPFMD-49: create Kafka Connect's three internal topics before the
      # worker starts.
      #
      # The broker runs with auto.create.topics.enable=true because
      # dataingestion and several services rely on it. That also means the
      # broker will happily create _debezium_connect_configs / _offsets /
      # _statuses with broker defaults -- cleanup.policy=delete and one
      # partition -- if anything asks for them first. Kafka Connect requires
      # compact, and refuses to start otherwise:
      #
      #   ConfigException: Topic '_debezium_connect_offsets' supplied via the
      #   'offset.storage.topic' property is required to have
      #   'cleanup.policy=compact' to guarantee consistency
      #
      # The offsets and status topics also need 25 and 5 partitions to match
      # the worker's defaults; the FetchCollector otherwise logs "unknown
      # topic or partition ... -1" / "-3" for partitions that were never
      # created.
      #
      # This used to be a standalone Job, which raced the worker on a fresh
      # cluster: ArgoCD applies resources without ordering, so the worker
      # could auto-create the topics first. As an initContainer it runs in the
      # same pod, strictly before the worker container, so ordering is
      # guaranteed even on a clean cluster.
      #
      # The broker image is used because that is where kafka-topics and
      # kafka-configs live; the debezium image ships neither, which is also
      # why debezium-register is written in Python against the REST API.
      - name: init-topics
        image: confluentinc/cp-kafka:7.6.1
        imagePullPolicy: IfNotPresent
        env:
        - name: BOOTSTRAP_SERVERS
          value: kafka:9092
        # Mirrors the worker's storage topic names so the two cannot drift.
        - name: CONFIG_TOPIC
          value: _debezium_connect_configs
        - name: OFFSET_TOPIC
          value: _debezium_connect_offsets
        - name: STATUS_TOPIC
          value: _debezium_connect_statuses
        # Kafka Connect defaults: 25 for offsets, 5 for status, 1 for config.
        - name: OFFSET_PARTITIONS
          value: "25"
        - name: STATUS_PARTITIONS
          value: "5"
        - name: CONFIG_PARTITIONS
          value: "1"
        - name: REPLICATION_FACTOR
          value: "1"
        command: ["python3", "-c"]
        args:
        - |
          import os
          import re
          import subprocess
          import sys
          import time

          BOOTSTRAP = os.environ["BOOTSTRAP_SERVERS"]
          RF = os.environ["REPLICATION_FACTOR"]

          TOPICS = [
              (os.environ["CONFIG_TOPIC"], int(os.environ["CONFIG_PARTITIONS"])),
              (os.environ["OFFSET_TOPIC"], int(os.environ["OFFSET_PARTITIONS"])),
              (os.environ["STATUS_TOPIC"], int(os.environ["STATUS_PARTITIONS"])),
          ]

          def cli(*args):
              return subprocess.run(
                  ["/usr/bin/kafka-topics", "--bootstrap-server", BOOTSTRAP, *args],
                  capture_output=True, text=True,
              )

          def broker_ready():
              return subprocess.run(
                  ["/usr/bin/kafka-broker-api-versions",
                   "--bootstrap-server", BOOTSTRAP],
                  capture_output=True, text=True,
              ).returncode == 0

          # On a fresh cluster Kafka may still be starting. Wait here instead
          # of failing, otherwise the pod restarts with backoff and the first
          # cycle is wasted.
          for _ in range(60):
              if broker_ready():
                  break
              time.sleep(2)
          else:
              print("ERROR: kafka not reachable at %s after 120s" % BOOTSTRAP,
                    file=sys.stderr)
              sys.exit(1)

          def describe(name):
              result = cli("--describe", "--topic", name)
              if result.returncode != 0:
                  return None
              return result.stdout

          def partitions(name):
              # The summary line reads
              #   Topic: <name>  TopicId: ...  PartitionCount: 5  ReplicationFactor: 1
              # while each partition is its own line that also starts with
              # "Topic:", so counting those would never match.
              match = re.search(r"PartitionCount:\s*(\d+)", describe(name) or "")
              return int(match.group(1)) if match else 0

          def cleanup_policy(name):
              result = subprocess.run(
                  ["/usr/bin/kafka-configs", "--bootstrap-server", BOOTSTRAP,
                   "--describe", "--entity-type", "topics", "--entity-name", name],
                  capture_output=True, text=True,
              )
              # The output lists the topic-level entries first; a broker default
              # of delete has no compact override anywhere.
              return "compact" if "cleanup.policy=compact" in result.stdout else "delete"

          failed = []
          for name, wanted in TOPICS:
              if describe(name) is None:
                  result = cli("--create", "--topic", name,
                               "--partitions", str(wanted),
                               "--replication-factor", RF,
                               "--config", "cleanup.policy=compact")
                  if result.returncode != 0:
                      failed.append("%s: create failed: %s"
                                    % (name, result.stderr.strip()[:200]))
                      continue
                  print("created %s with %d partition(s), cleanup.policy=compact"
                        % (name, wanted))
              else:
                  found = partitions(name)
                  policy = cleanup_policy(name)
                  print("%s exists: %d partition(s), cleanup.policy=%s"
                        % (name, found, policy))
                  if found != wanted:
                      print("  WARNING: Kafka Connect defaults to %d partition(s); "
                            "the topic has %d. Raise it with: kafka-topics --alter "
                            "--partitions %d" % (wanted, found, wanted))
                  if policy != "compact":
                      # Not fatal for the offset topic the way a missing compact
                      # policy is, but it means the log is never compacted.
                      print("  WARNING: cleanup.policy is %s, expected compact. "
                            "Recreate the topic to fix." % policy)

          if failed:
              print("ERROR: " + "; ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("all internal topics ready")
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          # cp-kafka's kafka user is 1000; the pod-level securityContext sets
          # 1001 for the worker, so override it here.
          runAsUser: 1000
          runAsGroup: 1000
      containers:
      - name: debezium-connect
        image: debezium
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: rest
        env:
        - name: BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: GROUP_ID
          value: debezium-connect
        - name: CONFIG_STORAGE_TOPIC
          value: _debezium_connect_configs
        - name: OFFSET_STORAGE_TOPIC
          value: _debezium_connect_offsets
        - name: STATUS_STORAGE_TOPIC
          value: _debezium_connect_statuses
        # The entrypoint only maps CONNECT_* env vars to worker properties
        # (underscores become dots), so these need the CONNECT_ prefix.
        - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: KEY_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: VALUE_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: ADVERTISED_HOST_NAME
          value: debezium-connect
        - name: CONNECT_REST_ADVERTISED_HOST_NAME
          value: debezium-connect
        - name: CONNECT_REST_PORT
          value: "8083"
        - name: HEAP_OPTS
          value: -Xms512m -Xmx512m
        - name: LOG_LEVEL
          value: info
        volumeMounts:
        - name: connector-config
          mountPath: /kafka/config
        - name: connector-data
          mountPath: /kafka/data
        - name: connector-logs
          mountPath: /kafka/logs
        readinessProbe:
          httpGet:
            path: /connectors
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: connector-config
        emptyDir: {}
      - name: connector-data
        emptyDir: {}
      - name: connector-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  labels:
    app: debezium-connect
spec:
  ports:
  - port: 8083
    targetPort: 8083
    name: rest
  selector:
    app: debezium-connect
---
# Reconciles the connector against the config in git.
#
# Kafka Connect persists connector config in _debezium_connect_configs, so the
# worker keeps running with whatever config was applied last, even when git has
# moved on. The previous version of this Job only ever POSTed and treated 409
# (already exists) as success, which meant a changed config in git was silently
# ignored. This Job instead:
#   1. reads the live config from the worker,
#   2. registers the connector if it is missing,
#   3. applies the git config with PUT /config only when they disagree,
#   4. waits for the connector and its task to report RUNNING,
#   5. fails if the live config still differs afterwards.
#
# Step 3 is conditional on purpose: PUT restarts the connector task even when
# the config is identical, and ArgoCD re-runs this Job (ttlSecondsAfterFinished
# expires the finished Job, ArgoCD recreates it), so an unconditional PUT would
# restart the task roughly every ten minutes for no reason.
#
# It also fails loudly, so drift shows up as a failed Job instead of silently
# persisting. That is the only monitoring added for this pipeline.
#
# The DB password lives in the debezium-db Secret and is injected into the
# __DB_PASSWORD__ placeholder, so no credential is stored in git. Password
# values are compared but never printed.
#
# Inspect with: kubectl -n onlineboutique-dev logs job/debezium-register
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-register
  annotations:
    # PostSync: the worker must be up before the connector config can be
    # applied, and the Job waits for the REST API itself (wait_for_api). As a
    # hook ArgoCD does not diff it, so the TTL deletion below no longer shows
    # up as OutOfSync on every cycle -- see the note on ttlSecondsAfterFinished.
    argocd.argoproj.io/hook: PostSync
  labels:
    app: debezium-connect
spec:
  backoffLimit: 6
  # ArgoCD deletes a successful PostSync hook itself. This is only a backstop
  # for when the Job is applied outside ArgoCD (kubectl apply), so it cannot be
  # mistaken for the reason the app used to flip to OutOfSync: hooks are not
  # part of the diffed desired state.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: debezium-register
    spec:
      restartPolicy: OnFailure
      # The overlay patch that adds ghcr-secret only targets Deployments, so
      # this Job pulls our private debezium image explicitly.
      imagePullSecrets:
      - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: register
        image: debezium
        imagePullPolicy: IfNotPresent
        # Python rather than shell: the config comparison is real JSON work,
        # and the image has no jq.
        command: ["python3", "-c"]
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: debezium-db
              key: db_password
        - name: CONNECT_URL
          value: http://debezium-connect:8083
        - name: CONFIG_DIR
          value: /connectors
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        args:
        - |
          import glob
          import http.client
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          CONNECT_URL = os.environ["CONNECT_URL"]
          CONFIG_DIR = os.environ["CONFIG_DIR"]
          PASSWORD_KEY = "database.password"
          TIMEOUT_SECONDS = 300
          # Transport-level retries per call. Five attempts with exponential
          # backoff spans roughly a minute of a worker that is busy rebalancing,
          # which is what the failure actually looked like.
          CONNECT_ATTEMPTS = 5

          class Failed(Exception):
              """Per-connector failure, so one broken connector does not hide
              the state of the others."""

          def request(method, path, payload=None, attempts=CONNECT_ATTEMPTS):
              """Return (status, body). HTTP errors are values, not exceptions,
              because 404 is a normal branch here.

              Transport failures are retried instead of propagating. The worker
              answers GET /status in milliseconds but GET /config can stall for
              the whole socket timeout while it rebalances, and an unhandled
              TimeoutError killed this Job outright -- the pod restarted, hit the
              same slow response, and after backoffLimit the reconcile silently
              stopped happening. Raising Failed instead means the connector is
              reported as unreconciled and the other one still gets processed.
              """
              data = json.dumps(payload).encode() if payload is not None else None
              last = None
              for attempt in range(attempts):
                  req = urllib.request.Request(
                      CONNECT_URL + path, data=data, method=method,
                      headers={"Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read()
                          return response.status, (json.loads(body) if body else None)
                  except urllib.error.HTTPError as exc:
                      body = exc.read()
                      try:
                          return exc.code, (json.loads(body) if body else None)
                      except ValueError:
                          return exc.code, None
                  except (urllib.error.URLError, TimeoutError, OSError,
                          http.client.HTTPException) as exc:
                      # TimeoutError and http.client.HTTPException are what a
                      # read that never completes raises; urlopen does not wrap
                      # them in URLError.
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(2 ** attempt)
              raise Failed("%s %s failed after %d attempts (%s)"
                           % (method, path, attempts, last))

          def fail(message):
              raise Failed(message)

          def show(key, value):
              """Never print a secret, not even from a live response."""
              return "<redacted>" if key == PASSWORD_KEY else repr(value)

          def drift(desired, live):
              """Keys where the worker disagrees with git.

              Only keys present in git are compared. Kafka Connect returns its
              own properties (the echoed connector name, and any default it
              chooses to materialise in future versions) which are not drift.
              """
              return {key: value for key, value in desired.items()
                      if key != "name" and live.get(key) != value}

          def report(label, keys, desired, live):
              print("%s %d key(s): %s" % (label, len(keys), ", ".join(sorted(keys))))
              for key in sorted(keys):
                  print("  %s: git=%s live=%s"
                        % (key, show(key, desired.get(key)), show(key, live.get(key))))

          def wait_for_api():
              """The connectors cannot be applied before the worker is up, and
              this Job may start before the Deployment is ready."""
              print("waiting for the Kafka Connect REST API at %s ..." % CONNECT_URL)
              deadline = time.time() + TIMEOUT_SECONDS
              while True:
                  try:
                      if request("GET", "/connectors")[0] == 200:
                          return
                  except Exception as exc:  # connection refused while starting
                      last_error = exc
                  if time.time() > deadline:
                      fail("REST API never became reachable (%s)" % last_error)
                  time.sleep(5)

          def reconcile(connector, desired):
              status, live = request("GET", "/connectors/%s/config" % connector)
              if status == 404:
                  status, body = request("POST", "/connectors",
                                         {"name": connector, "config": desired})
                  if status not in (200, 201):
                      fail("could not register (HTTP %s: %s)" % (status, body))
                  print("was missing from the worker and has been registered")
              elif status != 200:
                  fail("could not read the config (HTTP %s: %s)" % (status, live))
              else:
                  keys = drift(desired, live)
                  if not keys:
                      print("live config already matches git for all %d keys, left untouched"
                            % len(desired))
                  else:
                      report("drift found in", keys, desired, live)
                      status, body = request("PUT", "/connectors/%s/config" % connector,
                                             desired)
                      if status not in (200, 201):
                          fail("could not apply the config (HTTP %s: %s)" % (status, body))
                      print("git config applied with PUT /config")

              # Confirm the connector actually runs. A bad converter or an
              # unreachable Schema Registry fails the task here, not silently.
              print("waiting for the connector to report RUNNING ...")
              deadline = time.time() + TIMEOUT_SECONDS
              while True:
                  status, body = request("GET", "/connectors/%s/status" % connector)
                  if status != 200:
                      fail("could not read the status (HTTP %s: %s)" % (status, body))
                  connector_state = body.get("connector", {}).get("state")
                  tasks = [task.get("state") for task in body.get("tasks", [])]
                  if connector_state == "FAILED" or "FAILED" in tasks:
                      for task in body.get("tasks", []):
                          for line in (task.get("trace") or "").splitlines():
                              print(line)
                      fail("connector reported FAILED")
                  if connector_state == "RUNNING" and tasks and all(s == "RUNNING" for s in tasks):
                      print("connector and task are RUNNING")
                      break
                  if time.time() > deadline:
                      fail("timed out waiting for RUNNING (connector=%s tasks=%s)"
                           % (connector_state, tasks))
                  time.sleep(5)

              # Re-read the config, because the point of this Job is to prove the
              # worker matches git rather than to assume the PUT did it.
              status, live = request("GET", "/connectors/%s/config" % connector)
              if status != 200:
                  fail("could not re-read the config (HTTP %s)" % status)
              keys = drift(desired, live)
              if keys:
                  report("ERROR: config still differs in", keys, desired, live)
                  fail("config still differs after applying git")
              print("verified: the live config matches git")

          wait_for_api()

          # Every *.json in the ConfigMap is one connector, so adding a table
          # means adding a key here and nothing else.
          paths = sorted(glob.glob(os.path.join(CONFIG_DIR, "*.json")))
          if not paths:
              # Top level, so this cannot go through fail(): an uncaught Failed
              # would print a traceback instead of a readable error.
              print("ERROR: no connector config found in %s" % CONFIG_DIR)
              sys.exit(1)
          failures = []
          for path in paths:
              with open(path) as handle:
                  document = json.load(handle)
              name = document["name"]
              desired = dict(document["config"])
              desired[PASSWORD_KEY] = os.environ["DB_PASSWORD"]
              print("=== %s (%s) ===" % (name, os.path.basename(path)))
              try:
                  reconcile(name, desired)
              except Failed as exc:
                  print("ERROR: %s: %s" % (name, exc))
                  failures.append(name)

          if failures:
              print("ERROR: %d connector(s) not reconciled: %s"
                    % (len(failures), ", ".join(failures)))
              sys.exit(1)
          print("all %d connector(s) reconciled" % len(paths))
        volumeMounts:
        - name: connector-config
          mountPath: /connectors
          readOnly: true
        - name: job-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
