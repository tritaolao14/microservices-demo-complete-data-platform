# ArgoCD Application for the staging environment.
# Syncs the gitops/overlays/staging kustomization into the
# onlineboutique-staging namespace on the target cluster.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tritaolao14/microservices-demo-complete-data-platform
    targetRevision: Anh200726
    path: gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: onlineboutique-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
