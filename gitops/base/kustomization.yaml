# GitOps base: the full microservices + data platform stack, reusing the
# aggregated kubernetes-manifests kustomization (adservice...shippingservice,
# kafka, minio, postgresql, spark-iceberg-config, local-cdn).
#
# NOTE: loadgenerator is excluded upstream (development mode, deployed via
# skaffold). It is not part of the GitOps stack and can be enabled as its own
# ArgoCD Application during CD. Environment-specific overlays layer namespace
# + image patches on top of this base.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../kubernetes-manifests